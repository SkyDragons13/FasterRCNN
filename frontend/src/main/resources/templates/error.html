<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-red-50 text-center flex flex-col justify-center items-center min-h-screen">
<div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 w-full max-w-lg">
    <h1 class="text-4xl font-bold text-red-600 mb-4">Oops!</h1>
    <p class="text-gray-700 text-lg mb-2">Something went wrong.</p>
    <p class="text-sm text-gray-500" th:text="'Error: ' + ${status} + ' - ' + ${error}"></p>
    <a href="/home" class="mt-4 inline-block bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
        Go to Home
    </a>
</div>
</body>
</html>
