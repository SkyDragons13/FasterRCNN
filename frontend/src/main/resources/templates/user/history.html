<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>History</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold text-black mb-6">Image History</h1>

        <!-- Display the images dynamically -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div th:each="image : ${images}" class="bg-white rounded shadow-md">
                <a th:href="@{/results/{id}(id=${image.id})}" class="block p-4">
                    <img th:src="@{/history/image/{id}(id=${image.id})}" alt="Image" class="w-full h-48 object-cover rounded mb-4">
                    <h3 class="text-lg font-semibold text-gray-800" th:text="${image.name}"></h3>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
